<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EJ Reef — Canvas Graphics Pipeline</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <h1>EJ Reef</h1>
    <p class="subtitle">An interactive bioluminescent underwater scene</p>
    <p class="hint">Move your cursor to guide the jellyfish · Click to release glowing spores</p>
  </header>

  <main class="stage">
    <canvas id="reefCanvas" width="960" height="540" aria-label="Aurora Reef canvas animation"></canvas>
  </main>

  <footer class="footer">
    <div class="legend">
      <p class="legend-title">Demonstrations:</p>
      <div class="legend-items">
        <span class="legend-item"><span class="dot application"></span> Application</span>
        <span class="legend-item"><span class="dot geometry"></span> Geometry</span>
        <span class="legend-item"><span class="dot rasterization"></span> Rasterization</span>
      </div>
    </div>
    <p class="credit">HTML5 Canvas · CSS · JavaScript</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
